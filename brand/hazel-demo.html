<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazel animation demo</title>
<style>
  body { margin: 0; padding: 24px; background: #FFF7E8; color: #3B2A20; font: 600 18px system-ui, sans-serif; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; }
  .card { background: #fff; border-radius: 32px; padding: 16px 16px 12px; text-align: center; box-shadow: 0 10px 30px rgba(59,42,32,.10); }
  .slot svg { width: 220px; height: auto; display: block; }
  p { margin: 6px 0 0; }
  /* Parts use transform-origin set inside owl.svg, so these rules only say WHAT moves. */
  .slot .part { transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .2s; }

  /* Idle (live): breathe, blink, charm sway, tuft wiggle */
  .live #body-group { animation: breathe 3s ease-in-out infinite; }
  .live #eye-left, .live #eye-right { animation: blink 4.5s infinite; }
  .live #charm { animation: sway 2.6s ease-in-out infinite; }
  .live #tuft-right { animation: wiggle 5s ease-in-out infinite; }
  .live #head { animation: tilt 6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.02, .985); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  @keyframes sway { 50% { transform: rotate(-9deg); } }
  @keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-12deg); } 90% { transform: rotate(6deg); } }
  @keyframes tilt { 0%, 40%, 100% { transform: rotate(0); } 50%, 60% { transform: rotate(-5deg); } }

  /* Happy pose */
  .happy #eye-left, .happy #eye-right { opacity: 0; }
  .happy #eyes-happy { opacity: 1; }
  .happy #wing-left { transform: rotate(55deg); }
  .happy #wing-right { transform: rotate(-55deg); }
  .happy #hazel { transform: translateY(-10px); }
  .happy #beak-lower { transform: translateY(5px); }
  .happy #brow-left, .happy #brow-right { transform: translateY(-5px); }

  /* Thinking pose */
  .thinking #head { transform: rotate(-8deg); }
  .thinking .look { transform: translate(-4px, -6px); }
  .thinking #brow-left { transform: translateY(-6px) rotate(-6deg); }
  .thinking #glasses { transform: translateY(-3px); }
  .thinking #wing-right { transform: rotate(-28deg); }

  /* Talking (live): beak opens and closes */
  .talking #beak-lower { animation: talk .32s ease-in-out infinite alternate; }
  .talking #head { transform: rotate(4deg); }
  @keyframes talk { to { transform: translateY(6px); } }

  /* Try again: kind nod, soft brows */
  .nudge #head { transform: rotate(6deg) translateY(3px); }
  .nudge #brow-left { transform: rotate(8deg); }
  .nudge #brow-right { transform: rotate(-8deg); }
  .nudge #wing-left { transform: rotate(20deg); }

  @media (prefers-reduced-motion: reduce) { .slot * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="grid">
  <div class="card"><div class="slot live"></div><p>Idle</p></div>
  <div class="card"><div class="slot happy"></div><p>Happy</p></div>
  <div class="card"><div class="slot thinking"></div><p>Thinking</p></div>
  <div class="card"><div class="slot talking"></div><p>Talking</p></div>
  <div class="card"><div class="slot nudge"></div><p>Try again</p></div>
</div>
<script>
  // Serve this folder over http (for example: npx serve brand) so fetch works.
  fetch('mascot/owl.svg').then(r => r.text()).then(svg => {
    document.querySelectorAll('.slot').forEach(s => { s.innerHTML = svg; });
  });
</script>
</body>
</html>
